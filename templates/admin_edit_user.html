<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل بيانات العميل - الإدارة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #ecf0f1; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 30px 0;}
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <div class="card p-4">
            <h4 class="mb-4 text-center fw-bold text-primary"><i class="fas fa-user-edit"></i> تعديل العميل: {{ user.username }}</h4>
            <form action="/admin_edit_user/{{ user.id }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">اسم المستخدم</label>
                    <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">رقم الجوال</label>
                    <input type="text" name="phone" class="form-control" value="{{ user.phone }}" dir="ltr" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">تاريخ الانتهاء</label>
                    <input type="date" name="account_expiration" class="form-control" value="{{ user.account_expiration.strftime('%Y-%m-%d') if user.account_expiration else '' }}">
                    <small class="text-muted">اتركه فارغاً ليصبح الحساب مفتوحاً.</small>
                </div>
                <div class="mb-4 pb-3 border-bottom">
                    <label class="form-label fw-bold text-danger">تغيير كلمة المرور (اختياري)</label>
                    <input type="text" name="password" class="form-control" placeholder="اتركه فارغاً إذا لا تريد تغييرها">
                </div>

                {% if user.subscription %}
                <div class="mb-4 p-3 bg-light rounded border border-warning">
                    <label class="form-label fw-bold text-success"><i class="fas fa-stopwatch"></i> سرعة الفحص للعميل (مخفية عنه)</label>
                    <div class="input-group">
                        <input type="number" name="sleep_minutes" class="form-control text-center" value="{{ user.subscription.sleep_minutes }}" min="1" required>
                        <span class="input-group-text">دقيقة</span>
                    </div>
                    <small class="text-muted d-block mt-1">تحديد الباقة: كم دقيقة ينتظر النظام بين كل فحص؟ (تطبيق مباشر).</small>
                </div>
                {% endif %}

                <button type="submit" class="btn btn-primary w-100 fw-bold py-3"><i class="fas fa-save"></i> حفظ جميع التعديلات</button>
                <a href="/admin_dashboard" class="btn btn-light w-100 mt-2 fw-bold text-muted">إلغاء وعودة</a>
            </form>
        </div>
    </div>
</body>
</html>
