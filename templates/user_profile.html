<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - راصد حراج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1abc9c; --primary-dark: #16a085; --secondary: #34495e; }
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #f0f5f9 0%, #e6f7f4 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .profile-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-radius: 30px; padding: 2.5rem; box-shadow: 0 20px 40px -10px rgba(26,188,156,0.2); border: 1px solid rgba(255,255,255,0.5); width: 100%; max-width: 500px; }
        .profile-header { text-align: center; margin-bottom: 2rem; }
        .profile-header i { font-size: 4rem; color: var(--primary); margin-bottom: 1rem; }
        .form-control { border-radius: 50px; padding: 0.75rem 1.5rem; border: 1px solid #e2e8f0; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26,188,156,0.2); }
        .btn-update { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border: none; border-radius: 50px; padding: 0.75rem; font-weight: 700; color: white; width: 100%; }
        .btn-back { background: #edf2f7; border: 1px solid #cbd5e0; border-radius: 50px; padding: 0.75rem; text-align: center; display: block; margin-top: 1rem; color: #2d3748; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-header">
            <i class="fas fa-user-circle"></i>
            <h3>الملف الشخصي</h3>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} rounded-pill small">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">اسم المستخدم</label>
                <input type="text" class="form-control" value="{{ current_user.username }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">رقم الجوال</label>
                <input type="text" class="form-control" value="{{ current_user.phone }}" disabled>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">معرف التلقرام (Chat ID)</label>
                <input type="text" name="telegram_chat_id" class="form-control" value="{{ current_user.telegram_chat_id or '' }}" dir="ltr" placeholder="اختياري – لاستقبال الإعلانات على تيليجرام">
                <small class="text-muted">احصل عليه من <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a> وأرسل /start</small>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">كلمة المرور الحالية</label>
                <input type="password" name="old_password" class="form-control" required placeholder="لتأكيد التغييرات">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold small text-muted">كلمة المرور الجديدة</label>
                <input type="password" name="new_password" class="form-control" required placeholder="أدخل كلمة مرور جديدة">
            </div>
            <button type="submit" class="btn-update"><i class="fas fa-sync-alt ms-2"></i> تحديث</button>
        </form>
        <a href="{% if current_user.role == 'admin' %}/admin_dashboard{% else %}/user_dashboard{% endif %}" class="btn-back">العودة للوحة التحكم</a>
    </div>
</body>
</html>
