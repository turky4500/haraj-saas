<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة اسم المستخدم - راصد حراج</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1abc9c;
            --primary-dark: #16a085;
            --info: #3498db;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #f0f5f9 0%, #e6f7f4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px -10px rgba(52,152,219,0.2);
            border: 1px solid rgba(255,255,255,0.5);
            width: 100%;
            max-width: 450px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header i {
            font-size: 3.5rem;
            color: var(--info);
            margin-bottom: 1rem;
        }
        .auth-header h3 {
            font-weight: 700;
            color: #2c3e50;
        }
        .form-control {
            border-radius: 50px;
            padding: 0.75rem 1.5rem;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            border-color: var(--info);
            box-shadow: 0 0 0 3px rgba(52,152,219,0.2);
        }
        .btn-forgot {
            background: linear-gradient(135deg, var(--info), #2980b9);
            border: none;
            border-radius: 50px;
            padding: 0.75rem;
            font-weight: 700;
            font-size: 1.1rem;
            color: white;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(52,152,219,0.3);
        }
        .btn-forgot:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(52,152,219,0.4);
        }
        .back-link {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: 2px solid var(--info);
            color: var(--info);
            border-radius: 30px;
            padding: 0.4rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
        }
        body.dark-mode {
            background: linear-gradient(135deg, #121212 0%, #1e2b38 100%);
        }
        body.dark-mode .auth-card {
            background: rgba(31,41,55,0.9);
            border-color: #374151;
        }
        body.dark-mode .auth-header h3 {
            color: white;
        }
    </style>
</head>
<body>
    <button id="darkModeToggle" class="dark-mode-toggle">
        <i class="fas fa-moon"></i> ليلي
    </button>

    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user"></i>
            <h3>استعادة اسم المستخدم</h3>
            <p class="text-muted">أدخل رقم جوالك المسجل وسنرسل لك اسم المستخدم</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show rounded-pill small" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/forgot_username">
            <div class="mb-4">
                <label class="form-label fw-bold small text-muted">رقم الجوال (واتساب)</label>
                <input type="text" name="phone" class="form-control" required placeholder="9665xxxxxxxx" dir="ltr">
            </div>
            <button type="submit" class="btn-forgot mb-3">
                <i class="fas fa-paper-plane ms-2"></i> إرسال اسم المستخدم
            </button>
        </form>
        <div class="text-center">
            <a href="/login" class="back-link"><i class="fas fa-arrow-right ms-1"></i> العودة لتسجيل الدخول</a>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('darkModeToggle');
        const body = document.body;
        if(localStorage.getItem('darkMode') === 'enabled') {
            body.classList.add('dark-mode');
            toggleBtn.innerHTML = '<i class="fas fa-sun"></i> نهاري';
        }
        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            if(body.classList.contains('dark-mode')) {
                localStorage.setItem('darkMode', 'enabled');
                toggleBtn.innerHTML = '<i class="fas fa-sun"></i> نهاري';
            } else {
                localStorage.setItem('darkMode', 'disabled');
                toggleBtn.innerHTML = '<i class="fas fa-moon"></i> ليلي';
            }
        });
    </script>
</body>
</html>
