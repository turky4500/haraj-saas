<!-- إعدادات المراسلة -->
<div class="mb-4">
    <label class="form-label fw-bold"><i class="fas fa-comment-dots text-info ms-1"></i> طريقة الإرسال الافتراضية</label>
    <div class="row g-3">
        <div class="col-md-6">
            <label class="small text-muted">طريقة الإرسال</label>
            <select name="messaging_method" class="form-select">
                <option value="whatsapp" {% if settings.messaging_method == 'whatsapp' %}selected{% endif %}>واتساب</option>
                <option value="telegram" {% if settings.messaging_method == 'telegram' %}selected{% endif %}>تيليجرام</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="small text-muted">توكن بوت تيليجرام</label>
            <input type="text" name="telegram_bot_token" class="form-control" dir="ltr" value="{{ settings.telegram_bot_token or '' }}">
        </div>
        <div class="col-md-6">
            <label class="small text-muted">معرف الدردشة الافتراضي (لإشعارات الإدارة)</label>
            <input type="text" name="telegram_chat_id" class="form-control" dir="ltr" value="{{ settings.telegram_chat_id or '' }}">
        </div>
    </div>
    <small class="text-muted">عند اختيار تيليجرام، تأكد من أن المستخدمين قد أضافوا معرف التلقرام الخاص بهم.</small>
</div>
